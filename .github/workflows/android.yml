name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # Release signing: add these repository secrets (Settings › Secrets and variables › Actions):
      #   KEYSTORE_BASE64   base64 of your .jks file
      #   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # Without them the APK is signed with a temporary debug key (installable, but
      # later builds cannot be installed as an update over it).
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TINNISOFT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret: APK will be signed with a debug key."
          fi

      - name: Unit tests and lint
        run: |
          ./gradlew --no-daemon testDebugUnitTest lintDebug
          cat app/build/reports/lint-results-debug.txt || true

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          TINNISOFT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TINNISOFT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TINNISOFT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Tinnisoft-${{ steps.version.outputs.name }}.apk"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs dist/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tinnisoft-${{ steps.version.outputs.name }}
          path: dist/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
          if-no-files-found: ignore

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
